name: Update Live Aarti JSON

on:
  schedule:
    # Morning Aarti Window: 6:00 AM - 7:30 AM IST (00:30 - 02:00 UTC)
    - cron: '30,45 0 * * *'
    - cron: '0,15,30,45 1 * * *'
    
    # Evening Aarti Window: 7:00 PM - 8:30 PM IST (13:30 - 15:00 UTC)
    - cron: '30,45 13 * * *'
    - cron: '0,15,30,45 14 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Update Script
        run: python scripts/update_aarti.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live_aarti.json
          
          # Only commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Live Aarti URLs"
            git push
          else
            echo "No changes to commit."
          fi
